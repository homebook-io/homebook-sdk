name: .NET Build & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish:

    runs-on: ubuntu-latest

    env:
      VERSION: 1.0.${{ github.run_number }}
      NUGET_FILE: "**/*homebook*.nupkg"

    steps:

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore dependencies
        run: dotnet restore source/

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        shell: pwsh
        run: |
          dotnet build --configuration Release --no-restore -p:PackageVersion=${{ env.VERSION }} source/

      - name: Set Version Git Tag
        run: |
          git tag ${{ env.VERSION }}
          git push origin ${{ env.VERSION }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.VERSION }}
          path: ${{ env.NUGET_FILE }}

      - name: Publish
        run: dotnet nuget push ${{ env.NUGET_FILE }} --no-symbols --skip-duplicate --api-key ${{ secrets.NUGET_KEY }} --source "nuget.org"
